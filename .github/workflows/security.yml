name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 12 */14 * *'
  workflow_dispatch:

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit dependencies
        env:
          REPORT: ${{ runner.temp }}/audit.json
        run: |
          set -euo pipefail

          status=0
          pnpm audit --json > "$REPORT" || status=$?

          counts=$(jq -c '.metadata.vulnerabilities // empty' "$REPORT")
          if [ -z "$counts" ]; then
            echo "::error::pnpm audit emitted no summary (exit ${status}); failing closed"
            cat "$REPORT"
            exit 1
          fi

          echo "Advisories by severity: ${counts}"

          blocking=$(jq -r '[.advisories[] | select(.severity == "high" or .severity == "critical")] | length' "$REPORT")
          if [ "$blocking" -gt 0 ]; then
            jq -r '.advisories[] | select(.severity == "high" or .severity == "critical")
                   | "  [\(.severity)] \(.module_name) \(.vulnerable_versions) — \(.title)"' "$REPORT" | sort -u
            echo "::error::${blocking} high/critical advisories found"
            exit 1
          fi

          below=$(jq -r '[.advisories[] | select(.severity == "info" or .severity == "low" or .severity == "moderate")] | length' "$REPORT")
          if [ "$below" -gt 0 ]; then
            echo "::warning::${below} advisories below the high threshold; reported, not blocking"
          fi
